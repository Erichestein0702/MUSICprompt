name: Daily Reddit Fetcher

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  fetch-and-create-issue:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Fetch Reddit Posts (RSS Feed)
        id: fetch
        env:
          REDDIT_SUBREDDITS: ${{ vars.REDDIT_SUBREDDITS || 'SunoAI,Udio,aiMusic' }}
          MIN_UPVOTES: ${{ vars.MIN_UPVOTES || '50' }}
          TARGET_COUNT: ${{ vars.TARGET_COUNT || '7' }}
        run: |
          set -o pipefail
          python tools/reddit_fetcher.py 2>&1 | tee fetch_output.txt
      
      - name: Check if file was created
        id: check
        run: |
          if [ -f "prompts/pending/pending_$(date +%Y-%m-%d).md" ]; then
            echo "file_exists=true" >> $GITHUB_OUTPUT
            echo "file_path=prompts/pending/pending_$(date +%Y-%m-%d).md" >> $GITHUB_OUTPUT
          else
            echo "file_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create GitHub Issue
        if: steps.check.outputs.file_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0];
            
            const filePath = 'prompts/pending/pending_' + today + '.md';
            const content = fs.readFileSync(filePath, 'utf8');
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📥 今日待翻译 Prompt (${today}) [RSS]`,
              body: content,
              labels: ['translation-pending', 'automated', 'rss-feed'],
              assignees: ['Erichestein0702']
            });
            
            console.log(`Issue created: ${issue.data.html_url}`);
      
      - name: Create empty-result Issue
        if: steps.check.outputs.file_exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `今日无符合条件的 Prompt (${today})`,
              body: `## 结果说明\n\n采集程序正常结束，但没有生成待翻译文件。这表示本次没有内容通过当前阈值，并不等同于 RSS 请求失败。\n\n### 可检查项目\n\n1. Actions 日志中的各子版块抓取状态\n2. \`MIN_UPVOTES\` 是否过高\n3. 内容是否被质量过滤规则拦截\n\n如需调整阈值，请使用 Repository Variables。\n\n---\n\n*真正的程序错误会使 Fetch 步骤和工作流直接失败。*`,
              labels: ['fetch-empty', 'automated', 'rss-feed'],
              assignees: ['Erichestein0702']
            });
